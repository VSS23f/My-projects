<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOKEMPÔ</title>
</head>
<body>
   
   
   <script>
      
      let pedra   = 1;
      let papel   = 2;
      let tesoura = 0;

    var jogador = parseInt(prompt(" insira sua escolha pedra(1)  papel(2)  ou tesoura(0)"));

    var machine = Math.floor(Math.random() * 3); 

    let resultado =""
     
    console.log("Jogador escolheu: " + jogador);
    console.log("Máquina escolheu: " + machine);
   
         if (jogador === machine) {
            resultado = "Empate!";
        } 
        
        
        else if (
            (jogador === pedra && machine === tesoura) ||
            (jogador === papel && machine === pedra) ||
            (jogador === tesoura && machine === papel)
        ) {
            resultado = "Você VENCEU!";
        } 
        
        else {
            resultado = "Você PERDEU! A máquina venceu.";
        }
        
       alert("Jogador escolheu: " + jogador + "\nMáquina escolheu: " + machine + "\n" + resultado); 
   
   
   </script> 
</body>
</html>
