<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingressos a Venda</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
   <div class="container">
    <h1 class="display-4">Cadastre-se e compre seu ingresso</h1>
    <p class="lead">Preencha seus dados para continuar</p>
   </div>
   <div class="form-control-lg mb-2">
    <label for="exampleInputEmail1">Nome Completo</label>
    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Preencha o nome completo">
    <label for="exampleInputEmail1">Endereço de Email </label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Preencha o endereço de email">
    <label for="exampleInputEmail1">CPF</label>
    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Preencha o CPF">
   </div>
   <div class="form-control-lg mb-2">
    <label for="exampleColorInput">Escolha a cor da camisa</label>
    <input type="color" class="form-control-sm" id="exampleColorInput" value="#563d7c">
   </div>
   <div class="form-control-lg mb-2">
    <label for="exampleInputEmail1">Escolha o tipo de ingresso</label>
    <select class="form-select mb-2" aria-label="Default select example">
        <option selected>Selecione o tipo de ingresso</option>
        <option value="1">Pista</option>
        <option value="2">Camarote</option>
        <option value="3">Área VIP</option>
    </select>
    
    <div class="form-control-lg mb-2">
     <label form="formFile" class="form-label">Enviar foto para Confecção do crachá</label>
     <input class="form-control" type="file" id="formFile">
    </div>
    <div class="btn-group-lg mb-4" role="group" aria-label="Basic example">
      <button type="submit" class="btn btn-primary">Enviar</button>
      <button type="reset" class="btn btn-secondary">Limpar Formulário</button>
    </div>
    
</html>
