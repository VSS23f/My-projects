<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- icones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>


    <div class="container">

        <div class="row">

            <div class="col-md-8 border">

                <!-- tabela -->
                <table class="table table-striped table-hover table-sm">
                    <tr>
                        <th>NOME</th>
                        <th>TELEFONE</th>
                        <th>[AÇÃO]</th>
                    </tr>
                    <tbody id="lista">
                        <tr>
                            <td>ISLEIDE WILSON</td>
                            <td>11980808080</td>
                            <td>
                                <i class="bi bi-pen"></i> | <i class="bi bi-trash3-fill"></i>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="col border">
                <!-- formulario -->
                <form>
                    <input type="text" class="form-control" name="nome" id="nome" placeholder="Digite seu nome">
                    <input type="text" class="form-control" name="telefone" id="telefone"
                        placeholder="Digite seu telefone">

                    <input type="hidden" id="codigo">

                    <button class="btn btn-primary" id="btnCadastrar">Cadastrar</button>
                </form>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>

        let dados = localStorage.getItem('dados')

        let codigo_item = document.getElementById('codigo')

        if (dados) {
            dados = JSON.parse(dados)
        } else {
            dados = []
        }

        const lista = document.getElementById("lista")

        //javascript
        //C DO CRUD
        const btnCadastrar = document.getElementById("btnCadastrar")
        btnCadastrar.addEventListener('click', (e) => {
            e.preventDefault();
            //pegar o que estiver digitado no nome
            const nome = document.getElementById("nome")
            //pegar o que estiver digitado no telefone
            const telefone = document.getElementById("telefone")

            if (nome.value == "" || telefone.value == "") {
                alert('ow, tem que preencher tudo mano❤️')
            } else {

                if (codigo_item.value == "") {
                    //inserir na tabela
                    dados.push(
                        { "nome": nome.value, "telefone": telefone.value }
                    )

                }else{
                    dados[codigo_item.value].nome = nome.value
                    dados[codigo_item.value].telefone = telefone.value
                }

                localStorage.setItem('dados', JSON.stringify(dados))
                listar()
            }


        })

        //arrow function

        //R DO CRUD
        function listar() {
            //vem aqui ó

            //limpando a lista
            lista.innerHTML = ""

            nome.value = ""
            telefone.value = ""

            codigo_item.value = ""

            btnCadastrar.innerHTML="Cadastrar"
            btnCadastrar.classList.remove("btn-warning")

            dados.forEach((pessoa, index) => {

                lista.innerHTML += `
                <tr> 
                    <td>${pessoa.nome}</td>
                    <td>${pessoa.telefone}</td>
                    <td>
                        <button class="btn btn-warning" onclick="editar(${index})">
                            <i class="bi bi-pen"></i>
                        </button>
                        
                        <button class="btn btn-danger" onclick="excluir(${index})">
                             <i class="bi bi-trash3-fill"></i>
                        </button>
                    
                    </td>
                </tr>`

            });


        }


        //U DO CRUD
        function editar(codigo) {

            console.log("estamos editando" + codigo)

            nome.value = dados[codigo].nome
            telefone.value = dados[codigo].telefone

            codigo_item.value = codigo

            btnCadastrar.innerHTML = "Salvar"
            btnCadastrar.classList.add('btn-warning')
        }

        //D do crud

        function excluir(codigo){
            let confirmarcao = confirm("Deseja realmente excluir o item " + codigo + " ?")


            console.log(dados[codigo])
            if(confirmarcao){

                //apagando do array
                dados.splice(codigo,1)

                //atulizar o localstorage
                localStorage.setItem('dados', JSON.stringify(dados))

                listar();
            }
        }

        //chamando a função listar
        listar()


    </script>

</body>

</html>
